name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to publish to (only used when run manually)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the actual build is needed. Deliberately does NOT use
  # paths-ignore on the triggers above: "build" is a required status check
  # (branch protection), and a workflow that never triggers at all leaves
  # a required check permanently "Expected", blocking merges forever. A
  # job that runs and reports "skipped" satisfies a required check â€”
  # that's the mechanism this relies on.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: List changed files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Doing the exclusion in plain bash rather than relying on
          # dorny/paths-filter's own pattern combination: its patterns
          # within one filter are OR'd together (default 'some' mode), so
          # multiple '!pattern' entries in the same list don't chain into
          # an AND-exclusion the way .gitignore does â€” each negation
          # independently matches "any file that isn't X", and OR-ing
          # several such broad negations ends up matching almost
          # everything. The 'every' mode requires ALL patterns to match a
          # single file simultaneously, which doesn't fit multiple
          # unrelated positive folders (a file can't be under lib/** AND
          # android/** at once) either. Fetching the full changed-file
          # list and filtering it explicitly here avoids both pitfalls.
          CODE=false
          echo '${{ steps.filter.outputs.all_files }}' | jq -r '.[]' > /tmp/changed_files.txt
          while IFS= read -r f; do
            case "$f" in
              *.md|benchmark/*|.github/workflows/benchmark.yml) ;;
              *) echo true > /tmp/code_flag ;;
            esac
          done < /tmp/changed_files.txt
          [ -f /tmp/code_flag ] && CODE=true
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # T83: NDK is a multi-GB download re-fetched on every run otherwise.
      # Bump the key's version suffix if the pinned NDK version below changes.
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ${{ runner.os }}-ndk-28.2.13676358

      - name: Install Android SDK 37 + NDK 27
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # T83: ~/.pub-cache and Gradle's caches/wrapper are cold on every run
      # today because android/ isn't committed (see bootstrap step below).
      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Bootstrap: Re-generate Android project files (not versioned in repo)
      # Required because android/ folder is not committed (only Flutter code is versioned)
      # This ensures we always build with latest Flutter Android embedding (v2) and clean state
      - name: Bootstrap Flutter project
        run: flutter create --project-name audiolens --org io.nohzoh --platforms android . 2>&1 | head -20 || true

      - name: Show pubspec after bootstrap
        run: head -30 pubspec.yaml

      - name: Patch build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          [ ! -f "$FILE" ] && FILE="android/app/build.gradle"
          echo "Patching $FILE"

          # Replace full lines containing flutter.xxxSdkVersion or plain numbers
          # compileSdk 37 (T103): flutter_secure_storage 11.x requires
          # compileSdk >= 37 (its AAR metadata check fails the build
          # otherwise). targetSdk stays at 36 â€” compileSdk (API surface
          # available at compile time) and targetSdk (runtime behavior
          # opt-in) are independent.
          sed -i 's|^\s*compileSdk\s*=.*|    compileSdk = 37|' $FILE
          sed -i 's|^\s*minSdk\s*=.*|        minSdk = 26|' $FILE
          sed -i 's|^\s*targetSdk\s*=.*|        targetSdk = 36|' $FILE
          sed -i 's|^\s*compileSdkVersion\s.*|    compileSdkVersion 37|' $FILE
          sed -i 's|^\s*minSdkVersion\s.*|        minSdkVersion 26|' $FILE
          sed -i 's|^\s*targetSdkVersion\s.*|        targetSdkVersion 36|' $FILE

          # Add ndkVersion after compileSdk line
          # Set ndkVersion - replace entire line or add after compileSdk
          if grep -q 'ndkVersion' $FILE; then
            sed -i 's/ndkVersion = "[^"]*"/ndkVersion = "28.2.13676358"/' $FILE
          else
            # Add ndkVersion
          if grep -q ndkVersion $FILE; then
            sed -i 's|ndkVersion = ".*"|ndkVersion = "28.2.13676358"|' $FILE
          else
            echo '        ndkVersion = "28.2.13676358"' >> $FILE
            sed -i '/compileSdk = 37/{n;s/.*/        ndkVersion = "28.2.13676358"/}' $FILE
          fi
          fi

          # Add our dependencies at end of file
          # T82: com.google.mediapipe:tasks-genai dropped â€” only used by the
          # dead MediaPipePlugin.kt (mediapipe_service.dart, its Dart caller,
          # was removed in T06). Gemini Nano uses com.google.mlkit:genai-prompt
          # instead (GeminiNanoPlugin.kt), which stays.
          if ! grep -q 'genai-prompt' $FILE; then
            cat >> $FILE << 'DEPS'

          dependencies {
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta1")
              implementation("com.google.guava:guava:32.1.3-android")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          DEPS
          fi

          # T118/T21: MediaSessionCompat/PlaybackStateCompat/MediaButtonReceiver
          # for lock-screen/notification playback controls.
          if ! grep -q 'androidx.media:media' $FILE; then
            cat >> $FILE << 'DEPS'

          dependencies {
              implementation("androidx.media:media:1.7.0")
          }
          DEPS
          fi

          # T85: flutter_local_notifications requires core library desugaring.
          if ! grep -q 'isCoreLibraryDesugaringEnabled' $FILE; then
            sed -i 's|compileOptions {|compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' $FILE
          fi
          if ! grep -q 'coreLibraryDesugaring' $FILE; then
            cat >> $FILE << 'DEPS'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          DEPS
          fi

          echo "=== Patched file ==="
          cat $FILE

      # T100: pinning 2.2.0 here still built with Kotlin 2.2.10 effectively
      # (Gradle's default "highest version wins" conflict resolution â€”
      # kotlinx-coroutines-android/play-services below likely pull in a
      # newer Kotlin stdlib transitively than the plugin version we declare)
      # â€” Flutter's own deprecation warning wants >= 2.2.20, so pin there
      # directly instead of a version Gradle silently overrides anyway.
      - name: Patch Kotlin version
        run: |
          for f in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.2.20"/' $f && echo "âœ… Patched $f"
            [ -f "$f" ] && sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' $f
          done

      - name: Patch AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'ACCESS_FINE_LOCATION' $MANIFEST; then
            sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"\/>\n    <application/' $MANIFEST
          fi
          sed -i 's/android:label="[^"]*"/android:label="AudioLens"/' $MANIFEST
          # allowBackup=false (T80): history contains GPS coordinates and
          # photos â€” Android's default is allowBackup=true, which would let
          # adb backup extract it on an unlocked device with USB debugging.
          # Guarded (T82 fix): re-running this against an already-patched
          # manifest (e.g. a local build not starting from a fresh bootstrap)
          # duplicated the attribute and broke manifest merging.
          if ! grep -q 'allowBackup' $MANIFEST; then
            sed -i 's/android:label="AudioLens"/android:label="AudioLens" android:allowBackup="false"/' $MANIFEST
          fi
          # T89: Android 11+ (targetSdk 30+) hides other apps/services from
          # package queries by default â€” without this <queries> entry,
          # flutter_tts's isLanguageAvailable()/speak() can silently fail
          # to find the system TTS engine on some devices.
          if ! grep -q 'TextToSpeechService' $MANIFEST; then
            sed -i 's|</manifest>|<queries><intent><action android:name="android.speech.tts.engine.TextToSpeechService" /></intent></queries>\n</manifest>|' $MANIFEST
          fi
          # T85: a foreground service protects the app process's priority
          # while an analysis is in flight â€” without it, Android can kill
          # the process while backgrounded, silently dropping the analysis.
          if ! grep -q 'FOREGROUND_SERVICE_DATA_SYNC' $MANIFEST; then
            sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' $MANIFEST
          fi
          if ! grep -q 'AnalysisForegroundService' $MANIFEST; then
            sed -i 's|</application>|    <service android:name=".AnalysisForegroundService" android:foregroundServiceType="dataSync" android:exported="false"/>\n    </application>|' $MANIFEST
          fi
          # T118/T21: a second, separate foreground service for lock-screen/
          # notification playback controls (MediaSession) â€” different
          # foreground service type from the analysis one above, Android
          # 14+ enforces these strictly per declared type.
          if ! grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' $MANIFEST; then
            sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <application|' $MANIFEST
          fi
          if ! grep -q 'PlaybackForegroundService' $MANIFEST; then
            sed -i 's|</application>|    <service android:name=".PlaybackForegroundService" android:foregroundServiceType="mediaPlayback" android:exported="false"/>\n    </application>|' $MANIFEST
          fi
          # Home-screen quick-capture widget (new feature): jumps
          # straight to the camera on tap, see QuickCaptureWidgetProvider.kt.
          if ! grep -q 'QuickCaptureWidgetProvider' $MANIFEST; then
            sed -i 's|</application>|    <receiver android:name=".QuickCaptureWidgetProvider" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/quick_capture_widget_info"/></receiver>\n    </application>|' $MANIFEST
          fi
          # T97: register as a share target for photos from other apps
          # (Gallery, etc.) â€” a second intent-filter on the same activity,
          # right after the existing MAIN/LAUNCHER one.
          if ! grep -q 'android.intent.action.SEND' $MANIFEST; then
            sed -i 's|</intent-filter>|</intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <data android:mimeType="image/*"/>\n            </intent-filter>|' $MANIFEST
          fi
          echo "âœ… Manifest patched (allowBackup=false, TTS engine query, foreground service, share target)"

      - name: Add FileProvider
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'FileProvider' $MANIFEST; then
            sed -i 's|</application>|    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>\n    </application>|' $MANIFEST
          fi
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="."/>
              <cache-path name="cache" path="."/>
          </paths>
          XML
          echo "âœ… FileProvider configured"

      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/audiolens.jks
          cat > android/key.properties << EOF
          storeFile=audiolens.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          echo "âœ… Keystore ready"

      - name: Patch signing in build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          [ ! -f "$FILE" ] && FILE="android/app/build.gradle"
          python3 scripts/patch_signing.py "$FILE"
          echo "Done"

      - name: Debug - show gradle after signing
        run: |
          echo "=== build.gradle.kts ==="
          cat android/app/build.gradle.kts
          # key.properties holds the real keystore passwords in plaintext â€”
          # never dump its contents to CI logs, only confirm it exists.
          if [ -f android/key.properties ]; then
            echo "=== key.properties: present ==="
          else
            echo "=== key.properties: NOT FOUND ==="
          fi

      - name: Get dependencies
        run: flutter pub get 2>&1 | tee /tmp/pub_get.txt && cat /tmp/pub_get.txt | tail -30

      # The APK is only ever consumed for direct-sideload testing/manual
      # QA (e.g. via adb) or as a release-build sanity check (aapt can
      # inspect an APK, not an AAB) â€” never for the actual Play Store
      # publish, which needs the AAB below. A PR is never published, so
      # building it there is purely that sanity check; skip it on a plain
      # push to main, where the AAB is what actually matters and doing
      # both doubles the native build time (assembleRelease *and*
      # bundleRelease are separate Gradle invocations sharing the same
      # build graph) for no benefit. workflow_dispatch keeps both, since
      # that path is a full manual build+publish where having the APK for
      # a quick manual check before publishing is still useful.
      - name: Build APK (release)
        if: github.event_name != 'push'
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # T83: only real-device ABIs â€” x86/x86_64 are emulator-only and
          # sherpa_onnx has real native code per ABI to compile/link/package.
          # T84: --build-number gives every release a strictly increasing
          # versionCode (the run number always goes up), without needing to
          # hand-edit pubspec.yaml's committed "0.1.0+1" per upload â€” Play
          # Console rejects any upload whose versionCode isn't higher than
          # the last one.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_DATE="$BUILD_DATE" \
            2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Show errors on failure
        if: failure() && github.event_name != 'push'
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          [ -f build_output.txt ] && tail -150 build_output.txt >> $GITHUB_STEP_SUMMARY || echo "No build output file" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify APK exists and is valid
        if: github.event_name != 'push'
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          # Check APK is not empty
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK is empty"
            exit 1
          fi
          # aapt isn't on PATH on this runner â€” locate it in the installed
          # build-tools instead of silently no-op'ing the checks below.
          AAPT="$(find "$ANDROID_HOME" -name aapt -type f 2>/dev/null | head -1)"
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME â€” cannot verify the APK is non-debuggable"
            exit 1
          fi
          # Show APK info
          "$AAPT" dump badging "$APK_PATH" | grep -E "package:|version|sdkVersion"
          # T79: a release build must not be debuggable
          if "$AAPT" dump badging "$APK_PATH" | grep -qi "application-debuggable"; then
            echo "::error::APK is flagged as debuggable â€” this must not ship to users"
            exit 1
          fi
          echo "âœ… APK is not debuggable"
          echo "âœ… APK build verified: $APK_PATH ($(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH") bytes)"

      - name: Upload APK
        if: success() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # T84: the Play Store requires a .aab, not the .apk built above (which
      # stays around for direct-sideload testing, e.g. via adb). Reuses this
      # same job's already-bootstrapped/patched android/ project and signing
      # config rather than a separate job, so it's a cheap addition.
      #
      # Skipped on pull_request: a PR is never published, so there's
      # nothing to consume the AAB for there â€” only push (main, feeds
      # publish-play-store.yml) and workflow_dispatch (full manual
      # build+publish) actually need it.
      - name: Build App Bundle (release)
        if: github.event_name != 'pull_request'
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_DATE="$BUILD_DATE" \
            2>&1 | tee build_output_aab.txt
          exit ${PIPESTATUS[0]}

      - name: Show AAB errors on failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          echo "## AAB build errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          [ -f build_output_aab.txt ] && tail -150 build_output_aab.txt >> $GITHUB_STEP_SUMMARY || echo "No build output file" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify AAB exists
        if: github.event_name != 'pull_request'
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB_PATH" ]; then
            echo "::error::AAB not found or empty at $AAB_PATH"
            exit 1
          fi
          echo "âœ… AAB build verified: $AAB_PATH ($(stat -f%z "$AAB_PATH" 2>/dev/null || stat -c%s "$AAB_PATH") bytes)"

      - name: Upload AAB
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # T98: R8 is enabled on release builds â€” upload the mapping file so
      # crash reports (Play Console, Crashlytics, etc.) can be de-obfuscated.
      # Tied to the AAB path for the same reason as the AAB itself â€” only
      # ever needed for something that might get published.
      - name: Upload R8 mapping file
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: AudioLens-release-${{ github.sha }}-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      # Deliberately manual-only (workflow_dispatch), not on every push/PR â€”
      # an automatic upload on every merge would spam closed-testing testers
      # with a new build for every doc/config change. Track is chosen at
      # dispatch time (defaults to "alpha", the closed testing track's API
      # name) so the same workflow covers promoting to beta/production later
      # without editing this file.
      - name: Publish to Play Store
        if: success() && github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: io.nohzoh.audiolens
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          whatsNewDirectory: distribution/whatsnew
