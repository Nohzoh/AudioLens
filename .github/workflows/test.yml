name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter 3.32.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # sqflite_common_ffi (T09, history_service_migration_test.dart) needs
      # a system SQLite lib to dlopen. Usually already present on
      # ubuntu-latest, but pinned explicitly so this doesn't depend on an
      # unstated assumption about the runner image.
      - name: Install libsqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y libsqlite3-0

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
