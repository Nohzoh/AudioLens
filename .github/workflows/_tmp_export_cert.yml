name: Temp - Export upload key certificate

on:
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and Google's encryption public key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/ks.jks
          echo "" | base64 -d > /tmp/encryption_public_key.pem

      - name: Download PEPK tool
        run: curl -sSL -o /tmp/pepk.jar https://storage.googleapis.com/play_public/pepk.jar

      - name: Run PEPK to export the encrypted private key
        run: |
          java -jar /tmp/pepk.jar \
            --keystore=/tmp/ks.jks \
            --alias="${{ secrets.KEY_ALIAS }}" \
            --output=/tmp/output.zip \
            --include-cert \
            --rsa-aes-encryption \
            --encryption-key-path=/tmp/encryption_public_key.pem \
            --keystore-key-password="${{ secrets.KEYSTORE_PASSWORD }}" \
            --keystore-password="${{ secrets.KEYSTORE_PASSWORD }}"

      - uses: actions/upload-artifact@v7
        with:
          name: output
          path: /tmp/output.zip
          retention-days: 1
